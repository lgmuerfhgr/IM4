<!--------------------------------------------------------
* profile.html
* - Anzeige und Bearbeitung persönlicher Angaben (Name)
* - Logout-Funktion
* - Verbindung zu einer Box mittels serial_id
* - Anzeige aller verbundenen Boxen
* - Anzeige aller verknüpften Figuren
---------------------------------------------------------->

<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil</title>
  <link rel="stylesheet" href="css/design.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>

<body>
  <header>
    <a href="index.html" class="nav-button nav-left">
      <img src="assets/Icons/storys.png" alt="Geschichten">
    </a>
    <a href="profile.html" class="nav-button nav-right">
      <img src="assets/Icons/user.png" alt="Profil">
    </a>
  </header>

  <main>
    <div class="profile-container">
      <h1>Profil</h1> 
      

      <div class="profile-section">
        <h5>Persönliche Angaben</h5>

        <div>
          <label for="userName">Name</label>
          <input type="text" id="userName" value="..." />
        </div>

        <button onclick="logout()" class="logout-btn">Logout</button>
      </div>

      <div class="profile-section">
        <h5>Box verbinden</h5>

        <div id="deviceStatus" class="device-status">
          <!-- Wird durch JS gefüllt -->
        </div>

        <div id="connectForm" class="device-connect-form">
          <label for="deviceCode">Box-Code</label>

          <div class="device-input-row">
            <input type="text" id="deviceCode" placeholder="z.B. BOX001" />

            <button onclick="connectDevice()" class="connect-btn">
              Verbinden
            </button>
          </div>
        </div>
      </div>

      <div class="profile-section">
        <h5>Deine Figuren</h5>

        <div id="figureStatus" class="device-status">
          <!-- Wird durch JS gefüllt -->
        </div>
      </div>
    </div>
  </main>

  <script src="js/profile.js"></script>
</body>
</html>
