<!--------------------------------------------------------
* register.html
- Zeigt ein Registrierungsformular zur Erstellung eines neuen Kontos
- Felder: Name, E-Mail, Passwort
- Bei Abbruch: Weiterleitung zu login.html
* eingebundenes JS: js/register.js
* eingebundenes CSS: css/design.css, css/register.css
---------------------------------------------------------->

<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Konto erstellen</title>
  <link rel="stylesheet" href="css/design.css">
  <link rel="stylesheet" href="css/register.css">
</head>
<body>
  <div class="illustration_kringel">
    <img src="assets/illustrations/blaurotekringel.png" alt="Illustration_blaurotekringel">
</div>
  <main class="register">
    <form id="registerForm" class="card">
      <a class="close" href="login.html">×</a>
      <h1>Konto erstellen</h1>
      <input id="name" type="text" placeholder="Name" required>
      <input id="email" type="email" placeholder="E-Mail" required>
      <input id="password" type="password" placeholder="Passwort" required>
      <button>Konto erstellen</button>
    </form>
  </main>

  <script src="js/register.js"></script>
</body>
</html>
